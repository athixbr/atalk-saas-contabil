<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Atalk — Preparando atualização</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
  }

  .card img {
    width: 160px;
    height: auto;
    margin-bottom: 16px;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.1));
  }

  .spinner {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 4px solid #edf2f7;
    border-top-color: #667eea;
    animation: spin 0.9s linear infinite;
    margin: 8px 0 20px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    color: #2d3748;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  p {
    color: #718096;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: #edf2f7;
    overflow: hidden;
    margin-top: 24px;
  }

  .progress-bar {
    height: 100%;
    width: 40%;
    border-radius: 4px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    animation: slide 1.6s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  .footer {
    margin-top: 28px;
    color: #a0aec0;
    font-size: 0.8rem;
  }

  .footer strong {
    color: #718096;
  }
</style>
</head>
